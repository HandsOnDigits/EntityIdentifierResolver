[workspace]
resolver = "2"

members = [
    "crates/eir-core",
    "tools/eir-generator",
    "apps/playground",
    "apps/admin-ui",
]

default-members = [
    "apps/playground",
]

[workspace.dependencies]
chrono = "0.4.45"
rkyv = "0.8.17"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
