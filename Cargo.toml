[workspace]
resolver = "2"

members = [
    "crates/eir-core",
    "crates/eir-cli"
]

[workspace.dependencies]
chrono = "0.4.45"
rkyv = { version = "0.8.17", features = ["bytecheck"] }
bytecheck = "0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
roaring = "0.11.4"
serde_json = "1.0.151"
clap = { version = "4.6.5", features = ["derive"] }
clap_complete = "4.6.8"
tempfile = "3.27.0"
