[workspace]
resolver = "2"

members = [
    "crates/eir-core",
    "crates/eir-utils",
    "crates/eir-tools",
    "apps/playground",
    "apps/admin",
]

default-members = [
    "apps/playground",
]

[workspace.dependencies]
chrono = "0.4.45"
rkyv = { version = "0.8.17", features = ["bytecheck"] }
anyhow = "1.0.104"
roaring = "0.11.4"
